# Aria Download Manager configuration.
# Copy to config.yaml and edit. Every key is optional — anything you leave out
# falls back to the built-in default shown here.
#
#   cp config.example.yaml config.yaml

server:
  # The manager's only interface: a Unix socket the browser extension (through
  # its native-messaging host) and the DankMaterialShell widget connect to.
  # Nothing listens on the network, so an in-browser VPN or proxy cannot get in
  # the way. Mode 0600: this user only.
  # Blank = $XDG_RUNTIME_DIR/aria-download-manager.sock. After changing it, re-run
  #   python3 -m aria_download_manager --install-native-host
  socket: ""

# How often the manager polls aria2 (seconds). This is also the tick rate of the
# rules engine, so keep it at or below the smallest rule `for_seconds`.
poll_interval: 1.0
# Tick used when nothing is downloading *and* nothing is connected to the event
# stream. Rules only ever act on live downloads, so backing off here costs
# nothing; any command through this manager wakes the poller immediately. It is
# only a download started straight against aria2's own RPC that has to wait for
# this tick to be noticed, which is why it is kept short.
poll_interval_idle: 2.0

aria2:
  # true  -> the manager spawns and supervises its own aria2c
  # false -> attach to an aria2c you already run (set rpc.secret to match)
  managed: true
  binary: aria2c
  restart_on_exit: true
  startup_timeout: 20.0

  # true  -> aria2c is shut down together with the manager (downloads pause and
  #          resume next run; closing the terminal is handled gracefully)
  # false -> aria2c is left running when the manager exits, so downloads carry on
  #          in the background; the next run adopts it again
  stop_on_exit: true

  rpc:
    host: 127.0.0.1
    port: 6800
    # Blank + managed: a random secret is generated and stored (mode 0600) at
    # ~/.local/share/aria-download-manager/rpc-secret. It is kept rather than being
    # per-run so that a NEW manager can still talk to an aria2c left behind by an
    # old one (terminal closed, crash) and adopt it instead of failing to bind
    # this port. Set one explicitly if you attach to an external aria2c.
    secret: ""

  # Downloads survive restarts through this session file.
  session_file: ~/.local/share/aria-download-manager/aria2.session
  log_file: ~/.local/share/aria-download-manager/aria2.log

  # Raw aria2c flags appended last, for anything not covered below.
  extra_args: []
  #  - --bt-tracker=udp://tracker.opentrackr.org:1337/announce

  # Passed to aria2c as --key=value and editable live from the Settings tab.
  # Any valid aria2c long option works here; an invalid one stops aria2c from
  # starting (check the log file if that happens).
  options:
    dir: ~/Downloads
    continue: "true"

    # Queue and parallelism
    max-concurrent-downloads: "5"     # how many downloads run at once
    max-connection-per-server: "16"   # parallel connections to one host (max 16)
    split: "16"                       # parts a single file is cut into
    min-split-size: "1M"              # don't split below this

    # Retry behaviour
    max-tries: "10"
    retry-wait: "5"
    timeout: "60"
    connect-timeout: "30"

    # Speed limits — 0 means unlimited; accepts K/M suffixes
    max-overall-download-limit: "0"
    max-download-limit: "0"
    max-overall-upload-limit: "0"
    max-upload-limit: "0"

    # Disk
    file-allocation: "prealloc"       # none | prealloc | trunc | falloc
    auto-file-renaming: "true"
    allow-overwrite: "false"
    disk-cache: "32M"

    # BitTorrent
    follow-torrent: "true"
    bt-max-peers: "55"
    seed-ratio: "1.0"
    enable-dht: "true"

    # HTTP
    http-accept-gzip: "true"
    remote-time: "true"

    # Logging
    console-log-level: "warn"
    log-level: "notice"
    summary-interval: "0"

# ---------------------------------------------------------------------------
# Finished-download history.
#
# aria2's session file only stores downloads that are *unfinished* — that is what
# makes resume work, but it means completed downloads disappear from the list on
# the next restart, and aria2's own "purge" erases them sooner. The manager keeps
# its own record so finished downloads stay listed under the History filter, with
# enough detail to queue one again.
#
# This is bookkeeping only. In-progress downloads are never at risk: they live in
# aria2's session file plus the .aria2 control file next to the partial file, and
# resume automatically after a restart or a crash.
history:
  enabled: true
  file: ~/.local/share/aria-download-manager/history.json
  # Oldest entries are dropped past this count. 0 = unlimited.
  max_entries: 2000

# ---------------------------------------------------------------------------
# Torrents. download_only: never seed. Also switchable in Settings, and per
# torrent in its detail panel.
#   with aria2c:      new torrents get seed-time=0, aria2's overall upload is
#                     held at 1 B/s (0 would mean unlimited), and a torrent
#                     found seeding is stopped. The upload limit above is kept
#                     and comes back when this is off.
#   with qBittorrent: share limits of ratio 0 / seeding time 0 (the torrent
#                     stops the moment it completes), upload held at 1 KiB/s,
#                     and a torrent found seeding is stopped.
#
# engine: which engine downloads torrents (magnets, .torrent files and .torrent
# links). Everything else always goes to aria2c.
#   auto        - qBittorrent whenever qbittorrent-nox is installed (default)
#   qbittorrent - always qBittorrent
#   aria2       - aria2c, as before
# If qBittorrent cannot be started, torrents fall back to aria2c.
torrent:
  download_only: false
  engine: auto

# ---------------------------------------------------------------------------
# Desktop. float_windows: on niri and Hyprland, float the extension's download
# dialog and the DankBar widget's detached window as they open (the manager
# asks the compositor), so neither tiles. No window rules needed.
desktop:
  float_windows: true

# ---------------------------------------------------------------------------
# qBittorrent, when it is the torrent engine. Real per-file priorities, sequential
# download, first/last-piece priority and a current BitTorrent stack — what aria2
# lacks. The manager runs its own qbittorrent-nox with a private profile, its Web
# UI on localhost only with no password (the same trust as aria2's RPC), and
# keeps its download folder, speed limits, seed ratio and download-only in line
# with the settings above. Its own Web UI stays usable at http://127.0.0.1:<port>.
qbittorrent:
  # false -> attach to a qBittorrent you already run (set username/password if
  #          its Web UI wants a login). Its global seeding and speed preferences
  #          are then managed by this manager too.
  managed: true
  binary: qbittorrent-nox
  host: 127.0.0.1
  port: 8089
  username: ""
  password: ""
  profile: ~/.local/share/aria-download-manager/qbittorrent
  restart_on_exit: true
  # false -> leave qbittorrent-nox running when the manager exits; the next run adopts it.
  stop_on_exit: true
  startup_timeout: 30.0

# ---------------------------------------------------------------------------
# Sort downloads into subfolders of the download folder by what they are.
# Manager-side (see routing.py): aria2 itself has one folder. The folder is
# picked before the download starts, from the URL's filename, or a .torrent's
# largest file; a magnet's torrent waits paused for the moment its metadata
# takes to arrive. A folder chosen in the Add dialog always wins. A blank
# folder means the download folder itself, and an absolute path is used as it
# is. Leave "extensions" out to use the built-in lists.
routing:
  enabled: false
  folders:
    archive: Archives
    music: Music
    video: Video
    image: Images
    other: ""
  # extensions:
  #   archive: [zip, rar, 7z]

# ---------------------------------------------------------------------------
# Custom download actions.
#
# Each rule watches every download once per poll tick. When all `when`
# conditions hold *continuously* for `for_seconds`, the action fires once and
# that download enters `cooldown_seconds` for this rule.
#
# Conditions (all optional, all must match):
#   statuses:            list of aria2 statuses; default [active]
#   speed_below:         download speed under N bytes/s
#   speed_above:         download speed over N bytes/s
#   connections_below:   fewer than N live connections
#   min_age_seconds:     ignore downloads younger than this (avoids ramp-up)
#   min_progress /
#   max_progress:        percentage window
#   min_size:            total size at least N bytes
#   torrent_only:        true -> BitTorrent downloads only
#   http_only:           true -> non-BitTorrent only
#   name_matches:        regex against the download name
#
# Actions:
#   pause_resume         pause, wait resume_after_seconds, unpause  <- the classic stall fix
#                        Pausing frees a concurrency slot and aria2 starts the
#                        next queued download, so by default the action takes the
#                        slot back afterwards (`preserve_slot: true`). Set it to
#                        false to leave aria2's own behaviour alone, in which case
#                        the stalled download swaps places with the next one.
#   force_pause_resume   same, but drops connections immediately
#   restart              remove and re-add with the same URLs/options (HTTP/FTP only)
#   set_option           apply `options:` to that download (e.g. fewer connections)
#   stop                 pause and leave it paused
#   log_only             just record it in the log
#
# Safety valves: cooldown_seconds and max_triggers stop a rule from thrashing.
#
# Which speed figure rules judge by. Also selectable in the Rules tab.
#   hybrid (default) - the measured figure when available, else aria2's.
#   measured         - bytes actually written over the last ~3s only. aria2's own
#                      downloadSpeed is a long moving average, so it keeps
#                      reporting e.g. 5 MB/s for seconds after a transfer has
#                      actually stalled; the measured figure does not. While no
#                      measurement exists yet, a rule will not fire at all.
#   aria2            - aria2's smoothed number, lag included.
# A single rule can override this with `when: {speed_source: aria2}`.
rules_speed_source: hybrid
rules_enabled: true
rules:
  # The requirement: below X bytes/s for 3 seconds -> pause and resume.
  - name: stall-recovery
    enabled: true
    description: Pause+resume a download that drops below 50 KiB/s for 3s.
    when:
      statuses: [active]
      speed_below: 51200      # 50 KiB/s
      for_seconds: 3
      min_age_seconds: 8      # let it ramp up first
      max_progress: 99.0      # leave nearly-finished files alone
    action: pause_resume
    resume_after_seconds: 1.5
    preserve_slot: true       # take the concurrency slot back after resuming
    cooldown_seconds: 25
    max_triggers: 20

  - name: dead-download-restart
    enabled: false
    description: Fully re-add a download stuck at 0 B/s for a minute.
    when:
      statuses: [active]
      speed_below: 1
      for_seconds: 60
      min_age_seconds: 15
    action: restart
    cooldown_seconds: 120
    max_triggers: 5

  # Example: back off a host that only ever gives us one usable connection.
  - name: reduce-connections-when-throttled
    enabled: false
    description: Some servers throttle heavy parallelism; ask for less.
    when:
      statuses: [active]
      speed_below: 262144     # 256 KiB/s
      connections_below: 4
      for_seconds: 20
      min_age_seconds: 20
    action: set_option
    options:
      max-connection-per-server: "4"
      split: "4"
    cooldown_seconds: 300
    max_triggers: 2
