<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="lib/design.css">
<link rel="stylesheet" href="lib/filetree.css">
<link rel="stylesheet" href="dialog.css">
<title>New download — Aria Download Manager</title>
</head>
<body class="dlg">

<header class="dlg-head">
  <span id="logo" class="logo" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path id="logo-path" d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg></span>
  <div class="titles">
    <h1 id="title">New download</h1>
    <!-- For a plain file the name is the title, and editable in place. -->
    <input id="f-name" class="title-input" autocomplete="off" spellcheck="false" aria-label="File name" hidden>
    <p id="subtitle" class="dim">Checking the link…</p>
  </div>
</header>

<main id="body">
  <p class="loading"><span class="spinner" aria-hidden="true"></span><span id="loading-text">Checking the link…</span></p>
</main>

<!-- A plain file: what IDM asks before it starts. -->
<template id="file-view">
  <div class="stack">
    <div id="f-page" class="warn" hidden>
      <b><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>This link gives a web page, not the file</b>
      <span>Usually a login, a captcha or a link good for one download. Only the browser can fetch it.</span>
    </div>
    <div class="field">
      <span>Save to</span>
      <!-- The menu is the model; the chips are how it is shown and picked. -->
      <div class="folder">
        <div id="f-chips" class="fchips" role="radiogroup" aria-label="Save to"></div>
        <select id="f-dir" aria-label="Save to" hidden></select>
        <button type="button" class="btn btn-outline btn-sm" id="f-browse">Other…</button>
      </div>
      <input id="f-dir-custom" placeholder="/path/to/folder" spellcheck="false" hidden>
    </div>
    <details id="f-more">
      <summary>Connections and speed <span id="f-more-sum" class="dim"></span></summary>
      <div class="grid3">
        <label class="field"><span>Connections per server</span><input id="f-conn" type="number" min="1" max="16"></label>
        <label class="field"><span>Parts</span><input id="f-split" type="number" min="1"></label>
        <label class="field"><span>Speed limit <small>blank: none</small></span>
          <span class="unit-input">
            <input id="f-limit" inputmode="decimal" placeholder="No limit">
            <select id="f-limit-unit" aria-label="Unit"><option value="K">KiB/s</option><option value="M" selected>MiB/s</option></select>
          </span>
        </label>
      </div>
    </details>
  </div>
</template>

<!-- A torrent: what qBittorrent asks once it has the file list. -->
<template id="torrent-view">
  <div class="stack">
    <div class="field">
      <span>Save to</span>
      <div class="folder">
        <div id="t-chips" class="fchips" role="radiogroup" aria-label="Save to"></div>
        <select id="t-dir" aria-label="Save to" hidden></select>
        <button type="button" class="btn btn-outline btn-sm" id="t-browse">Other…</button>
      </div>
      <input id="t-dir-custom" placeholder="/path/to/folder" spellcheck="false" hidden>
    </div>
    <div id="t-tree"></div>
    <div class="opts">
      <label class="setting" for="t-donly">
        <span class="text">
          <span class="label">Stop sharing when done</span>
          <span id="t-donly-hint" class="hint">Uploads as little as possible and stops the moment the download finishes.</span>
        </span>
        <span class="switch"><input type="checkbox" id="t-donly"><span class="track"><span class="knob"></span></span></span>
      </label>
      <details data-qb>
        <summary>Advanced</summary>
        <label class="setting" for="t-seq">
          <span class="text">
            <span class="label">Download in order</span>
            <span class="hint">Fetches each file from start to end, so its first parts can be used before it finishes. Usually slower.</span>
          </span>
          <span class="switch"><input type="checkbox" id="t-seq"><span class="track"><span class="knob"></span></span></span>
        </label>
        <label class="setting" for="t-fl">
          <span class="text">
            <span class="label">First and last pieces first</span>
            <span class="hint">Gets each file&#39;s start and end early, so it can be opened or previewed sooner.</span>
          </span>
          <span class="switch"><input type="checkbox" id="t-fl"><span class="track"><span class="knob"></span></span></span>
        </label>
      </details>
    </div>
  </div>
</template>


<footer class="dlg-foot">
  <div class="buttons">
    <button id="btn-browser" class="btn btn-text" hidden>Let the browser</button>
    <span class="spacer"></span>
    <button id="btn-cancel" class="btn btn-text">Cancel</button>
    <button id="btn-later" class="btn btn-outline" disabled title="Add it paused, to start from the manager">Queue</button>
    <button id="btn-start" class="btn btn-primary" disabled>Download</button>
  </div>
  <label class="check keep"><input type="checkbox" id="keep-asking" checked> Ask me before every download</label>
  <p id="error" class="hint err" hidden></p>
</footer>

<script src="lib/common.js"></script>
<script src="lib/present.js"></script>
<script src="lib/link.js"></script>
<script src="lib/filetree-core.js"></script>
<script src="lib/filetree-view.js"></script>
<script src="dialog.js"></script>
</body>
</html>
