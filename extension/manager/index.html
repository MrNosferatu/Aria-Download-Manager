<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aria Download Manager</title>
<link rel="icon" href="aria2-logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- The header and the tab bar are one masthead and stick as one block. They
     used to stick separately, which meant the tab bar carried a hand-measured
     `top: 59px` for the header's height — a number that was wrong the moment the
     header grew, and wrong again whenever the header wraps on a narrow window.
     Nesting them removes the measurement instead of re-tuning it. -->
<div class="masthead">
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg></span>
    <div>
      <h1>Aria Download Manager</h1>
      <span id="aria2-pill" class="pill pill-idle">connecting…</span>
    </div>
  </div>

  <!-- The live rate is why the page is open, so it leads. -->
  <div class="throughput">
    <span class="rate down"><span class="arrow">↓</span><b id="stat-down">–</b></span>
    <span class="rate up"><span class="arrow">↑</span><b id="stat-up">–</b></span>
  </div>

  <div class="stats">
    <div class="stat"><label>Active</label><b id="stat-active">0</b></div>
    <div class="stat"><label>Queued</label><b id="stat-waiting">0</b></div>
    <div class="stat"><label>Done</label><b id="stat-complete">0</b></div>
    <div class="stat"><label>Failed</label><b id="stat-error">0</b></div>
  </div>

  <div class="topactions">
    <button id="btn-pause-all" class="btn btn-icon btn-ghost" title="Pause every download" aria-label="Pause every download"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
    <button id="btn-resume-all" class="btn btn-icon btn-ghost" title="Resume every download" aria-label="Resume every download"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
    <button id="btn-purge" class="btn btn-icon btn-ghost" title="Clear finished and failed rows from the list" aria-label="Clear finished rows"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11h-1V3a2 2 0 0 0-4 0v8h-1a5 5 0 0 0-5 5v7h16v-7a5 5 0 0 0-5-5zm2 12h-2v-4h-2v4h-2v-4h-2v4H8v-4H6v-3a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v7z"/></svg></button>
    <button id="btn-add" class="btn btn-primary">+ Add download</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="downloads">Downloads</button>
  <button class="tab" data-tab="rules">Rules <span id="rules-badge" class="badge">0</span></button>
  <button class="tab" data-tab="settings">Settings</button>
  <div class="spacer"></div>
  <label class="tabtoggle" title="Master switch for all custom download-action rules">
    <span>Rules engine</span>
    <span class="switch"><input type="checkbox" id="rules-master"><span class="track"><span class="knob"></span></span></span>
  </label>
</nav>
</div>

<main>
  <!-- ---------------- downloads ---------------- -->
  <section id="tab-downloads" class="tabpane active">
    <div class="filterbar">
      <button class="chip active" data-filter="all">All <span class="n" id="count-all"></span></button>
      <button class="chip" data-filter="active">Active <span class="n" id="count-active"></span></button>
      <button class="chip" data-filter="waiting">Queued <span class="n" id="count-waiting"></span></button>
      <button class="chip" data-filter="paused">Paused <span class="n" id="count-paused"></span></button>
      <button class="chip" data-filter="complete">Complete <span class="n" id="count-complete"></span></button>
      <button class="chip" data-filter="error">Error <span class="n" id="count-error"></span></button>
      <button class="chip chip-history" data-filter="history" title="Finished downloads the manager has recorded, kept across restarts">History</button>
      <button id="btn-select" class="btn btn-small" title="Select several downloads to act on at once">Select</button>
      <input id="search" class="search" placeholder="Filter by name…">
    </div>

    <!-- shown only in selection mode -->
    <div id="bulk-bar" class="bulkbar" hidden>
      <span class="count" id="bulk-count">0 selected</span>
      <button id="bulk-all" class="btn btn-small">All</button>
      <span class="spacer"></span>
      <button id="bulk-pause" class="btn btn-small" title="Pause the selected downloads"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg><span>Pause</span></button>
      <button id="bulk-resume" class="btn btn-small" title="Resume the selected downloads"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span>Resume</span></button>
      <button id="bulk-remove" class="btn btn-small btn-danger" title="Remove the selected downloads"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg><span>Remove</span></button>
    </div>
    <div id="bulk-confirm" class="bulkbar confirming" hidden>
      <span class="question" id="bulk-question"></span>
      <span class="spacer"></span>
      <button id="bulk-cancel" class="btn btn-small">Cancel</button>
      <button id="bulk-keep" class="btn btn-small">Keep files</button>
      <button id="bulk-delete" class="btn btn-small btn-danger">Delete files</button>
    </div>

    <div id="history-bar" class="historybar" hidden>
      <span id="history-summary" class="hint"></span>
      <button id="btn-history-clear" class="btn btn-small btn-danger">Clear history</button>
    </div>
    <div id="downloads" class="downloads"></div>
    <p id="empty" class="empty">No downloads. Hit <b>+ Add download</b> or send one from the browser extension.</p>
  </section>

  <!-- ---------------- rules ---------------- -->
  <section id="tab-rules" class="tabpane">
    <div class="panehead">
      <h2>Custom download actions</h2>
      <div>
        <label class="inline-field" title="Which speed figure rules judge by">
          <span>Judge speed by</span>
          <select id="rules-speed-source">
            <option value="hybrid">measured, else aria2 (default)</option>
            <option value="measured">measured write speed only</option>
            <option value="aria2">aria2's reported speed</option>
          </select>
        </label>
        <button id="btn-rule-add" class="btn btn-small">+ New rule</button>
        <button id="btn-rules-save" class="btn btn-primary btn-small">Save rules</button>
      </div>
    </div>
    <div id="rules-list"></div>
    <div class="panehead"><h2>Recent triggers</h2></div>
    <div id="rule-triggers" class="loglist"></div>
  </section>

  <!-- ---------------- settings ---------------- -->
  <section id="tab-settings" class="tabpane">
    <div class="panehead">
      <h2>Global aria2 options</h2>
      <div>
        <input id="opt-search" class="search" placeholder="Filter options…">
        <button id="btn-opt-reload" class="btn btn-small">Reload</button>
        <button id="btn-opt-save" class="btn btn-primary btn-small">Save changed</button>
      </div>
    </div>
    <div id="options-groups"></div>
    <details id="options-advanced-wrap" open>
      <summary>All options (advanced)<span id="advanced-count" class="count"></span></summary>
      <div id="options-advanced" class="optgrid"></div>
    </details>

    <div class="panehead"><h2>aria2c process</h2></div>
    <div class="optgroup">
      <div id="proc-info" class="kv"></div>
      <div class="group-actions">
        <button id="btn-restart-aria2" class="btn btn-danger btn-small">Restart aria2c</button>
      </div>
    </div>

    <!-- The log is diagnostic material, not a view to watch, so it folds away
         here rather than holding a tab of its own. -->
    <div class="panehead">
      <h2>Event log</h2>
      <div><button id="btn-log-clear" class="btn btn-small">Clear view</button></div>
    </div>
    <div id="loglist" class="loglist"></div>
  </section>

</main>

<!-- ---------------- add dialog ---------------- -->
<dialog id="add-dialog">
  <form id="add-form" method="dialog">
    <h2>Add download</h2>

    <label class="field">
      <span>URLs <small>one per line — http(s), ftp, magnet:</small></span>
      <textarea id="add-uris" rows="4" placeholder="https://example.com/file.iso&#10;magnet:?xt=urn:btih:…"></textarea>
    </label>

    <label class="field">
      <span>…or a .torrent / .metalink file</span>
      <input type="file" id="add-file" accept=".torrent,.meta4,.metalink">
    </label>

    <div class="grid2">
      <label class="field"><span>Save to directory</span><input id="add-dir" placeholder="(default)"></label>
      <label class="field"><span>Rename to <small>single file only</small></span><input id="add-out" placeholder="(from server)"></label>
      <label class="field"><span>Connections per server <small>max-connection-per-server</small></span><input id="add-conn" type="number" min="1" max="16" placeholder="16"></label>
      <label class="field"><span>Parts / split <small>split</small></span><input id="add-split" type="number" min="1" placeholder="16"></label>
      <label class="field"><span>Min part size <small>min-split-size</small></span><span id="add-minsplit"></span></label>
      <label class="field"><span>Speed limit <small>max-download-limit</small></span><span id="add-limit"></span></label>
      <label class="field"><span>Referer</span><input id="add-referer" placeholder="(none)"></label>
      <label class="field"><span>User-Agent</span><input id="add-ua" placeholder="(default)"></label>
      <label class="field"><span>Cookie header</span><input id="add-cookie" placeholder="k=v; k2=v2"></label>
      <label class="field"><span>Proxy <small>all-proxy</small></span><input id="add-proxy" placeholder="(none)"></label>
      <label class="field"><span>Checksum <small>e.g. sha-256=…</small></span><input id="add-checksum" placeholder="(none)"></label>
      <label class="field"><span>Queue position <small>blank = end</small></span><input id="add-position" type="number" min="0" placeholder="end"></label>
    </div>

    <label class="field"><span>Extra headers <small>one per line, <code>Name: value</code></small></span>
      <textarea id="add-headers" rows="2" placeholder="Authorization: Bearer …"></textarea></label>

    <div class="checkrow">
      <label class="boolopt"><span>Add paused</span>
        <span class="switch"><input type="checkbox" id="add-paused"><span class="track"><span class="knob"></span></span></span></label>
      <label class="boolopt"><span>Treat all URLs as mirrors of one file</span>
        <span class="switch"><input type="checkbox" id="add-mirrors"><span class="track"><span class="knob"></span></span></span></label>
    </div>

    <div class="dialog-actions">
      <button type="button" id="add-cancel" class="btn">Cancel</button>
      <button type="button" id="add-submit" class="btn btn-primary">Add</button>
    </div>
  </form>
</dialog>

<div id="toasts" class="toasts"></div>
<template id="row-template">
  <article class="dl">
    <div class="dl-main">
      <input type="checkbox" class="dl-pick" hidden>
      <button class="chev" title="Details" aria-label="Details"></button>
      <div class="dl-body">
        <div class="dl-title">
          <span class="dl-name"></span>
          <span class="dl-badges"></span>
        </div>
        <div class="dl-meta"></div>
      </div>
      <div class="dl-actions"></div>
    </div>
    <div class="dl-confirm" hidden></div>
    <div class="dl-detail" hidden></div>
    <div class="bar"><div class="bar-fill"></div></div>
  </article>
</template>

<script src="../lib/link.js"></script>
<script src="option-help.js"></script>
<script src="app.js"></script>
</body>
</html>
