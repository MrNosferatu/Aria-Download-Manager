<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/design.css">
<link rel="stylesheet" href="ui.css">
<title>Aria Download Manager</title>
</head>
<body class="popup">

<!-- What is happening comes first, as in the DankBar's quick menu: a headline,
     how fast and how long, then the downloads that matter, then the buttons. -->
<header>
  <div class="titles">
    <h1 id="headline">Connecting…</h1>
    <span id="subline" class="hint"></span>
  </div>
  <div class="chrome">
    <button id="open-ui" class="btn btn-icon" title="Open the manager" aria-label="Open the manager">
      <svg class="ico" viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
    </button>
    <button id="options" class="btn btn-icon" title="Extension settings" aria-label="Extension settings">
      <svg class="ico" viewBox="0 0 24 24"><path d="M19.14 12.94a7.5 7.5 0 0 0 .05-.94 7.5 7.5 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.61l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.67 8.87a.5.5 0 0 0 .12.61l2.03 1.58c-.04.31-.05.62-.05.94s.01.63.05.94l-2.03 1.58a.5.5 0 0 0-.12.61l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.12-.56 1.62-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.61l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5z"/></svg>
    </button>
  </div>
</header>

<!-- When a link in the chain is broken: which one, and the fix. -->
<section id="trouble" class="trouble" hidden>
  <div class="t-head">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    <b id="trouble-title"></b>
  </div>
  <p id="trouble-text" class="hint"></p>
  <code id="trouble-cmd" class="cmd" hidden></code>
  <div class="row">
    <button id="trouble-primary" class="btn btn-primary btn-sm"></button>
    <button id="trouble-secondary" class="btn btn-sm" hidden></button>
  </div>
</section>

<div id="overall" class="overall" hidden>
  <div class="progress"><i id="overall-bar"></i></div>
  <span id="overall-text" class="hint"></span>
</div>

<div id="list" class="plist" hidden></div>

<div id="bulk" class="bulk3" hidden>
  <button id="b-pause" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg><span>Pause all</span></button>
  <button id="b-resume" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span>Resume</span></button>
  <button id="b-clear" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11h-1V3c0-1.1-.9-2-2-2h-2c-1.1 0-2 .9-2 2v8H8c-2.76 0-5 2.24-5 5v7h18v-7c0-2.76-2.24-5-5-5zm3 10h-2v-3c0-.55-.45-1-1-1s-1 .45-1 1v3h-2v-3c0-.55-.45-1-1-1s-1 .45-1 1v3H9v-3c0-.55-.45-1-1-1s-1 .45-1 1v3H5v-5c0-1.65 1.35-3 3-3h8c1.65 0 3 1.35 3 3v5z"/></svg><span>Clear</span></button>
</div>

<div id="off-banner" class="offbanner" hidden>
  <span class="hint">Catching is off — the browser keeps its downloads. Add still works.</span>
  <button id="turn-on" class="btn btn-primary btn-sm">Turn on</button>
</div>

<form id="add" class="addrow">
  <input id="url" placeholder="Paste a link or magnet" autocomplete="off" aria-label="Link to download">
  <button type="submit" class="btn btn-primary">Add</button>
</form>
<span id="add-hint" class="hint add-hint" hidden></span>

<footer>
  <!-- Same rows as the settings page, so a switch means the same thing in
       both places. The per-site rule is an exception to the one above it, so it
       is indented and quieter rather than being a peer. -->
  <label class="setting" for="enabled">
    <span class="text"><span class="label">Send downloads to Aria</span></span>
    <span class="switch"><input type="checkbox" id="enabled"><span class="track"><span class="knob"></span></span></span>
  </label>
  <label class="setting sub" for="site-block">
    <span class="text"><span class="label">Except on <span id="host">this site</span></span></span>
    <span class="switch"><input type="checkbox" id="site-block"><span class="track"><span class="knob"></span></span></span>
  </label>
  <label class="setting sub" for="captureMagnets">
    <span class="text"><span class="label">Catch torrents</span></span>
    <span class="switch"><input type="checkbox" id="captureMagnets"><span class="track"><span class="knob"></span></span></span>
  </label>
</footer>

<script src="lib/common.js"></script>
<script src="lib/link.js"></script>
<script src="popup.js"></script>
</body>
</html>
